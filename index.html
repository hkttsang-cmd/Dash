<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>小西灣 Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d0f12;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    height:100vh;
    overflow:hidden;
}

.container{
    display:flex;
    height:100vh;
}

/* 左邊 */

.left{
    width:30%;
    background:#151922;
    padding:30px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.clock{
    font-size:84px;
    font-weight:700;
    line-height:1;
}

.date{
    margin-top:10px;
    color:#aaa;
    font-size:18px;
}

.weather-icon{
    font-size:64px;
    margin-top:40px;
}

.location{
    font-size:32px;
    margin-top:15px;
}

.temperature{
    font-size:80px;
    font-weight:700;
    margin-top:15px;
}

.humidity{
    font-size:26px;
    color:#ccc;
    margin-top:10px;
}

.updated{
    margin-top:40px;
    color:#888;
    font-size:18px;
}

/* 右邊 */

.right{
    flex:1;
    padding:20px;
    overflow:hidden;
}

.route-card{
    background:#1a1f29;
    border-radius:18px;
    height:calc((100vh - 140px)/6);
    margin-bottom:12px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;
}

.route-name{
    font-size:52px;
    font-weight:bold;
    color:#54d3ff;
    width:120px;
}

.times{
    display:flex;
    gap:20px;
}

.time-box{
    background:#2a3342;
    min-width:110px;
    text-align:center;
    padding:12px;
    border-radius:12px;
    font-size:30px;
    font-weight:600;
}

</style>
</head>
<body>

<div class="container">

    <div class="left">

        <div class="clock" id="clock">--:--</div>

        <div class="date" id="date"></div>

        <div class="weather-icon">☁️</div>

        <div class="location">
            小西灣
        </div>

        <div class="temperature" id="temperature">
            --°
        </div>

        <div class="humidity" id="humidity">
            濕度 --%
        </div>

        <div class="updated" id="updated">
            更新中...
        </div>

    </div>

    <div class="right" id="routes"></div>

</div>

<script>

const ROUTES=[
"788",
"789",
"8P",
"82",
"82X",
"85"
];

// 請換成真正城巴 Stop ID
const STOP_ID="ISR";

function updateClock(){

    const now=new Date();

    document.getElementById("clock").innerHTML=
        now.toLocaleTimeString("zh-HK",{
            hour:"2-digit",
            minute:"2-digit"
        });

    document.getElementById("date").innerHTML=
        now.toLocaleDateString("zh-HK",{
            year:"numeric",
            month:"long",
            day:"numeric",
            weekday:"long"
        });

}

function formatTime(eta){

    if(!eta) return "--";

    return new Date(eta)
        .toLocaleTimeString("zh-HK",{
            hour:"2-digit",
            minute:"2-digit"
        });

}

async function loadWeather(){

    try{

        const res=await fetch(
        "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc"
        );

        const data=await res.json();

        const temp=data.temperature.data[1].value;

        document.getElementById("temperature")
        .innerHTML=temp+"°";

        document.getElementById("humidity")
        .innerHTML=
        "濕度 "+
        data.humidity.data[0].value+
        "%";

    }catch(err){

        console.log(err);

    }

}

async function loadBus(){

    let html='';

    for(const route of ROUTES){

        try{

            const res=await fetch(
            `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${STOP_ID}/${route}`
            );

            const data=await res.json();

            const eta=data.data
            .filter(x=>x.eta)
            .slice(0,3)
            .map(x=>formatTime(x.eta));

            while(eta.length<3){
                eta.push("--");
            }

            html+=`
            <div class="route-card">

                <div class="route-name">
                    ${route}
                </div>

                <div class="times">
                    <div class="time-box">${eta[0]}</div>
                    <div class="time-box">${eta[1]}</div>
                    <div class="time-box">${eta[2]}</div>
                </div>

            </div>
            `;

        }catch(e){

            console.log(e);

        }

    }

    document.getElementById("routes").innerHTML=html;

    document.getElementById("updated").innerHTML=
    "更新 "+
    new Date().toLocaleTimeString("zh-HK");

}

updateClock();
loadWeather();
loadBus();

setInterval(updateClock,1000);
setInterval(loadBus,15000);
setInterval(loadWeather,300000);

</script>

</body>
</html>
