<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小西灣藍灣半島 - 門口資訊站</title>
    <style>
        :root {
            --bg-color: #fcf6f0;
            --card-bg: #ffffff;
            --primary-text: #4a3e3d;
            --accent-pink: #f8a5c2;
            --accent-blue: #70a1ff;
            --accent-green: #2ed573;
            --bus-card-bg: #f7f1e3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text);
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            margin-bottom: 20px;
        }

        .clock-container {
            display: flex;
            align-items: baseline;
            gap: 15px;
        }

        .clock {
            font-size: 3.2rem;
            font-weight: 800;
            color: #2f3542;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }

        .date {
            font-size: 1.2rem;
            color: #747d8c;
            font-weight: 600;
        }

        .refresh-btn {
            background-color: var(--accent-pink);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 2px 8px rgba(248, 165, 194, 0.4);
            transition: transform 0.1s ease;
        }

        .refresh-btn:active {
            transform: scale(0.95);
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2f3542;
        }

        .weather-content {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            gap: 15px;
        }

        .temp {
            font-size: 5rem;
            font-weight: 800;
            color: #ff6b81;
            line-height: 1;
        }

        .weather-desc {
            font-size: 1.3rem;
            color: #57606f;
            text-align: center;
            font-weight: 500;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #f8f9fa;
            padding: 18px;
            border-radius: 16px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            font-size: 0.95rem;
            color: #a4b0be;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2f3542;
        }

        .bus-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .bus-item {
            background: var(--bus-card-bg);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .bus-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bus-number {
            background: #2f3542;
            color: #eccc68;
            font-size: 1.2rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .bus-dest {
            font-size: 0.95rem;
            color: #57606f;
            font-weight: 700;
        }

        .bus-eta {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .eta-primary {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .eta-time {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2ed573;
            font-variant-numeric: tabular-nums;
        }
        
        .eta-time.no-data {
            color: #ff6b81;
            font-size: 1.3rem;
        }

        .eta-secondary {
            font-size: 0.85rem;
            color: #747d8c;
            display: flex;
            justify-content: space-between;
            border-top: 1px dashed #dcdde1;
            padding-top: 6px;
            margin-top: 4px;
        }
        
        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            color: #747d8c;
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="clock-container">
            <div class="clock" id="clock">00:00:00</div>
            <div class="date" id="date">加載中...</div>
        </div>
        <button class="refresh-btn" onclick="initData()">🔄 立即更新</button>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-title">🌸 小西灣 / 香港島天氣</div>
            <div class="weather-content">
                <div class="weather-main">
                    <div class="temp" id="temp">--°</div>
                </div>
                <div class="weather-desc" id="weather-desc">正在讀取最新氣象數據...</div>
                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-label">相對濕度</div>
                        <div class="detail-value" id="humidity">--%</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">數據地區</div>
                        <div class="detail-value" id="weather-location">香港島</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🚌 藍灣半島總站開出 (城巴)</div>
            <div class="bus-list" id="bus-list">
                <div class="status-msg">正在自動搜尋車站並獲取實時班次...</div>
            </div>
        </div>
    </div>

    <script>
        const targetRoutes = [
            { route: "788", dest: "往 中環" },
            { route: "789", dest: "往 金鐘" },
            { route: "8P",  dest: "往 灣仔碼頭" },
            { route: "82",  dest: "往 北角碼頭" },
            { route: "85",  dest: "往 寶馬山" },
            { route: "82X", dest: "往 鰂魚涌" }
        ];

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-HK', { hour12: false });
            
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchWeather() {
            try {
                const res = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc");
                const data = await res.json();
                
                let tempObj = data.temperature.data.find(t => t.place === "筲箕灣") || 
                              data.temperature.data.find(t => t.place === "香港天文台") || 
                              data.temperature.data[0];
                
                document.getElementById('temp').innerText = `${tempObj.value}°`;
                document.getElementById('weather-location').innerText = tempObj.place;
                
                if (data.humidity && data.humidity.data[0]) {
                    document.getElementById('humidity').innerText = `${data.humidity.data[0].value}%`;
                }

                let desc = "天氣大致良好";
                if (data.rainfall && data.rainfall.data.some(r => r.max > 0)) {
                    desc = "局部地區有雨";
                }
                document.getElementById('weather-desc').innerText = desc;

            } catch (err) {
                console.error("Weather fetch error:", err);
                document.getElementById('weather-desc').innerText = "天氣數據更新失敗";
            }
        }

        let routeStopCache = {};
        let isFetching = false;

        async function findStopIdForSiuSaiWan(route) {
            if (routeStopCache[route]) return routeStopCache[route];
            
            try {
                const [outData, inData] = await Promise.all([
                    fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/route-stop/CTB/${route}/outbound`).then(r => r.json()).catch(()=>({data:[]})),
                    fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/route-stop/CTB/${route}/inbound`).then(r => r.json()).catch(()=>({data:[]}))
                ]);
                
                let candidateStops = [];
                if (outData.data && outData.data.length > 0) candidateStops.push(outData.data[0].stop);
                if (inData.data && inData.data.length > 0) candidateStops.push(inData.data[0].stop);
                
                for (let stop of candidateStops) {
                    let stopInfo = await fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/stop/${stop}`).then(r => r.json()).catch(()=>null);
                    if (stopInfo && stopInfo.data && stopInfo.data.name_tc) {
                        if (stopInfo.data.name_tc.includes("藍灣") || stopInfo.data.name_tc.includes("小西灣")) {
                            routeStopCache[route] = stop;
                            return stop;
                        }
                    }
                }
            } catch (e) {
                console.error(`[錯誤] 尋找 ${route} 車站失敗`, e);
            }
            return "001259"; 
        }

        async function fetchBusETA() {
            if (isFetching) return;
            isFetching = true;
            
            const busListContainer = document.getElementById('bus-list');
            let htmlContent = '';
            const now = new Date();

            for (let bus of targetRoutes) {
                try {
                    let stopId = await findStopIdForSiuSaiWan(bus.route);
                    
                    let rawData = [];
                    if (stopId) {
                        let res = await fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/CTB/${stopId}/${bus.route}`).then(r => r.json()).catch(()=>({data:[]}));
                        if (res.data) {
                            rawData = res.data;
                        }
                    }

                    let busList = rawData.filter(item => {
                        if (!item.eta || item.eta.trim() === "") return false;
                        const safeEta = item.eta.replace(/ /g, 'T');
                        const etaDate = new Date(safeEta);
                        if (isNaN(etaDate.getTime())) return false;
                        
                        const diffMs = etaDate - now;
                        return diffMs > -60000; 
                    });

                    busList.sort((a, b) => {
                        return new Date(a.eta.replace(/ /g, 'T')) - new Date(b.eta.replace(/ /g, 'T'));
                    });

                    let uniqueBuses = [];
                    let seenTimes = new Set();
                    for (let b of busList) {
                        if (!seenTimes.has(b.eta)) {
                            seenTimes.add(b.eta);
                            uniqueBuses.push(b);
                        }
                    }

                    let firstBus = uniqueBuses[0];
                    let secondBus = uniqueBuses[1];
                    let thirdBus = uniqueBuses[2];

                    let etaText = "未有班次";
                    let upcomingText = "後續班次: --";
                    let isNoData = true;

                    if (firstBus && firstBus.eta) {
                        isNoData = false;
                        const safeFirstEta = firstBus.eta.replace(/ /g, 'T');
                        const etaTime = new Date(safeFirstEta);
                        
                        etaText = etaTime.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
                        
                        if (firstBus.rmk_tc) {
                            etaText += ` <span style="font-size: 1rem; color: #a4b0be; font-weight: 600;">(${firstBus.rmk_tc})</span>`;
                        }
                    }

                    let subEtas = [];
                    [secondBus, thirdBus].forEach(b => {
                        if (b && b.eta) {
                            const safeEta = b.eta.replace(/ /g, 'T');
                            const t = new Date(safeEta);
                            const c = t.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
                            subEtas.push(c);
                        }
                    });

                    if (subEtas.length > 0) {
                        upcomingText = `後續: ${subEtas.join(" / ")}`;
                    }

                    htmlContent += `
                        <div class="bus-item">
                            <div class="bus-header">
                                <span class="bus-number">${bus.route}</span>
                                <span class="bus-dest">${bus.dest}</span>
                            </div>
                            <div class="bus-eta">
                                <div class="eta-primary">
                                    <span class="eta-time ${isNoData ? 'no-data' : ''}">${etaText}</span>
                                </div>
                                <div class="eta-secondary">
                                    <span>${upcomingText}</span>
                                </div>
                            </div>
                        </div>
                    `;

                } catch (err) {
                    console.error(`Bus ${bus.route} fetch error:`, err);
                    htmlContent += `
                        <div class="bus-item">
                            <div class="bus-header">
                                <span class="bus-number">${bus.route}</span>
                                <span class="bus-dest">${bus.dest}</span>
                            </div>
                            <div class="bus-eta">
                                <div class="eta-primary">
                                    <span class="eta-time no-data" style="font-size: 1.1rem;">讀取失敗或無服務</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }

            busListContainer.innerHTML = htmlContent;
            isFetching = false;
        }

        function initData() {
            fetchWeather();
            fetchBusETA();
        }

        initData();
        setInterval(fetchBusETA, 30000);   
        setInterval(fetchWeather, 600000); 
    </script>
</body>
</html>
